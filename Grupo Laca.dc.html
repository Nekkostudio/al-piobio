<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; background: #0c0b0a; }
    * { box-sizing: border-box; }
    a { color: #c9a668; text-decoration: none; }
    a:hover { color: #e0c088; }
    .link-row { transition: border-color .2s ease, background .2s ease; }
    .link-row:hover { border-color: #c9a668 !important; background: #1c1a17 !important; }
  </style>
</helmet>

<div style="min-height: 100vh; width: 100%; background: #0c0b0a; display: flex; align-items: flex-start; justify-content: center; padding: 48px 16px;">
  <div style="width: 100%; max-width: 430px; display: flex; flex-direction: column; align-items: center; gap: 28px;">

    <div style="text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; margin-top: 24px;">
      <h1 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 34px; line-height: 1.2; color: #f2ede3;">
        Grupo Laca
      </h1>
      <div style="width: 54px; height: 2px; background: #c9a668;"></div>
      <p style="margin: 0; font-family: 'Montserrat', sans-serif; font-size: 13px; line-height: 1.7; letter-spacing: 0.5px; color: #b7ac96; max-width: 320px;">
        Nossas empresas e redes sociais.
      </p>
    </div>

    <div style="width: 100%; display: flex; flex-direction: column; gap: 12px;">
      <sc-for list="{{ links }}" as="link" hint-placeholder-count="5">
        <a href="{{ link.href }}" target="_blank" rel="noopener noreferrer" class="link-row" style="display: flex; align-items: center; gap: 14px; width: 100%; border: 1px solid #4a4030; border-radius: 4px; padding: 15px 18px; background: #171512;">
          <span style="width: 26px; height: 26px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; color: #c9a668;">{{ link.icon }}</span>
          <span style="font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 1.5px; color: #f2ede3; text-transform: uppercase;">{{ link.label }}</span>
        </a>
      </sc-for>
    </div>

    <div style="text-align: center; padding-top: 8px; display: flex; flex-direction: column; gap: 4px;">
      <span style="font-family: 'Montserrat', sans-serif; font-size: 13px; color: #d8d2c4;">Grupo Laca</span>
      <span style="font-family: 'Montserrat', sans-serif; font-size: 11px; color: #7d7768;">Todos os direitos reservados.</span>
    </div>

  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const instaIcon = React.createElement('svg', { viewBox: '0 0 24 24', width: 18, height: 18, fill: 'none', stroke: 'currentColor', strokeWidth: 1.5 },
      React.createElement('rect', { x: 3, y: 3, width: 18, height: 18, rx: 5 }),
      React.createElement('circle', { cx: 12, cy: 12, r: 4 }),
      React.createElement('circle', { cx: 17.5, cy: 6.5, r: 1 }));
    const siteIcon = React.createElement('svg', { viewBox: '0 0 24 24', width: 18, height: 18, fill: 'none', stroke: 'currentColor', strokeWidth: 1.5 },
      React.createElement('circle', { cx: 12, cy: 12, r: 9 }),
      React.createElement('path', { d: 'M3 12h18M12 3c2.5 2.5 4 6 4 9s-1.5 6.5-4 9c-2.5-2.5-4-6-4-9s1.5-6.5 4-9z' }));
    return {
      links: [
        { label: 'Zenthera Biopharma', href: 'https://www.zentherabiopharma.com/', icon: siteIcon },
        { label: 'Inject Health', href: 'https://www.instagram.com/inject.health/', icon: instaIcon },
        { label: 'Alucell Campo Grande', href: 'https://www.instagram.com/alucell.cg/', icon: instaIcon },
        { label: 'Alucell Capital', href: 'https://www.instagram.com/alucellcapital/', icon: instaIcon },
        { label: 'Alucell Franquias', href: 'https://www.instagram.com/alucell.franquias/', icon: instaIcon },
      ]
    };
  }
}

</script>
</body>
</html>
