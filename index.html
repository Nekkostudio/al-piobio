<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&amp;family=Montserrat:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <script src="./image-slot.js"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #121110; }
    * { box-sizing: border-box; }
    a { color: #c9a668; text-decoration: none; }
    a:hover { color: #e0c088; }
    .link-row { transition: border-color .2s ease, background .2s ease; }
    .link-row:hover { border-color: #c9a668 !important; background: #1c1a17 !important; }
    #profile-photo::part(frame) { background: transparent !important; }
  </style>
</helmet>

<div style="min-height: 100vh; width: 100%; background: #0c0b0a; display: flex; align-items: flex-start; justify-content: center; padding: 48px 16px;">
  <div style="width: 100%; max-width: 430px; display: flex; flex-direction: column; align-items: center; gap: 28px;">

    <div style="position: relative; width: 100%; display: flex; flex-direction: column; align-items: center;">
      <div style="position: relative; width: 100%; height: 340px;">
        <image-slot id="profile-photo" shape="rect" style="width: 100%; height: 100%; background: transparent;" fit="contain" placeholder="Foto de perfil" src="uploads/alipio back3.png"></image-slot>
        <div style="position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to bottom, rgba(12,11,10,0) 50%, #0c0b0a 92%);"></div>
      </div><div style="text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; margin-top: -64px; z-index: 1;">
        <h1 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 56px; line-height: 1.2; color: #f2ede3; width: 408px; height: 129px">
          Alípio Marcus<br>Laca de Oliveira
        </h1>
        <div style="width: 54px; height: 2px; background: #c9a668;"></div>
        <p style="margin: 0; font-family: 'Montserrat', sans-serif; font-size: 13px; line-height: 1.7; letter-spacing: 0.5px; color: #b7ac96; max-width: 320px;">
          Advogado. Empresário.<br>Coordenador de projetos. Cônsul<br>Honorário do Cazaquistão<br>em MS.
        </p>
      </div>

      
    </div>

    <div style="width: 100%; display: flex; flex-direction: column; gap: 12px;">
      <sc-for list="{{ links }}" as="link" hint-placeholder-count="6">
        <a href="{{ link.href }}" class="link-row" style="display: flex; align-items: center; gap: 14px; width: 100%; border: 1px solid #4a4030; border-radius: 4px; padding: 15px 18px; background: #171512;">
          <span style="width: 26px; height: 26px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; color: #c9a668;">{{ link.icon }}</span>
          <span style="font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 1.5px; color: #f2ede3; text-transform: uppercase;">{{ link.label }}</span>
        </a>
      </sc-for>
    </div>

    <div style="text-align: center; padding-top: 8px; display: flex; flex-direction: column; gap: 4px;">
      <span style="font-family: 'Montserrat', sans-serif; font-size: 13px; color: #d8d2c4;">Alípio Marcus Laca de Oliveira</span>
      <span style="font-family: 'Montserrat', sans-serif; font-size: 11px; color: #7d7768;">Todos os direitos reservados.</span>
    </div>

  </div>
</div>

</x-dc>
